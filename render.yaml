services:
  - type: web
    name: lunchround
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
